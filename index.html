<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나현 지식공간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sidebar-w: 240px;
  --topbar-h: 56px;
  --bg: #ffffff;
  --sidebar-bg: #fafafa;
  --sidebar-border: #efefef;
  --text: #0a0a0a;
  --text-2: #555;
  --text-3: #999;
  --border: #ebebeb;
  --active-bg: #f0f0f0;
  --hover-bg: #f5f5f5;
  --accent: #0a0a0a;
  --pill-bg: #f2f2f2;
  --tr: 180ms cubic-bezier(.4,0,.2,1);
}

html, body {
  height: 100%; overflow: hidden;
  font-family: 'Inter', -apple-system, 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}

.layout { display: flex; height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex; flex-direction: column;
  flex-shrink: 0; height: 100vh;
  transition: width var(--tr), transform var(--tr);
  overflow: hidden; z-index: 50;
  position: fixed; top: 0; left: 0; bottom: 0;
}
.sidebar.collapsed { width: 0; border-right: none; }

.sidebar-logo {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 18px 16px;
}
.logo-mark {
  width: 26px; height: 26px; background: var(--text);
  border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.logo-mark svg { width: 13px; height: 13px; fill: white; }
.logo-text { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; letter-spacing: -0.01em; }

.sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 10px 20px; scrollbar-width: none; }
.sidebar-scroll::-webkit-scrollbar { display: none; }

.nav-sec { margin-bottom: 2px; }
.nav-sec-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 7px 8px; border-radius: 8px; cursor: pointer;
  border: none; background: none; font-family: inherit; text-align: left;
  transition: background var(--tr); color: var(--text-2);
}
.nav-sec-btn:hover { background: var(--hover-bg); }
.nav-sec-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.5; }
.nav-sec-title { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; flex: 1; color: var(--text-2); }
.nav-sec-chevron { width: 12px; height: 12px; color: var(--text-3); transition: transform var(--tr); flex-shrink: 0; }
.nav-sec.open .nav-sec-chevron { transform: rotate(90deg); }
.nav-children { display: none; flex-direction: column; gap: 1px; padding: 2px 0 6px 8px; }
.nav-sec.open .nav-children { display: flex; }

.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 7px; cursor: pointer;
  border: none; background: none; font-family: inherit;
  text-align: left; width: 100%; transition: background var(--tr);
  color: var(--text-2); font-size: 13px; font-weight: 400; letter-spacing: -0.01em;
}
.nav-item:hover { background: var(--hover-bg); color: var(--text); }
.nav-item.active { background: var(--active-bg); color: var(--text); font-weight: 500; }
.nav-item-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; }
.nav-item.active .nav-item-dot { background: var(--text); }
.nav-item-date { margin-left: auto; font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* 하위 그룹 (반도체/전력 같은 중간 카테고리) */
.nav-group { margin-bottom: 1px; }
.nav-group-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 6px 10px; border-radius: 7px; cursor: pointer;
  border: none; background: none; font-family: inherit; text-align: left;
  transition: background var(--tr); color: var(--text-2); font-size: 13px; font-weight: 400;
}
.nav-group-btn:hover { background: var(--hover-bg); color: var(--text); }
.nav-group-chevron { width: 10px; height: 10px; color: var(--text-3); transition: transform var(--tr); flex-shrink: 0; margin-left: auto; }
.nav-group.open .nav-group-chevron { transform: rotate(90deg); }
.nav-sub-children { display: none; flex-direction: column; gap: 1px; padding: 2px 0 4px 10px; }
.nav-group.open .nav-sub-children { display: flex; }
.nav-sub-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px; border-radius: 7px; cursor: pointer;
  border: none; background: none; font-family: inherit;
  text-align: left; width: 100%; transition: background var(--tr);
  color: var(--text-3); font-size: 12.5px; font-weight: 400;
}
.nav-sub-item:hover { background: var(--hover-bg); color: var(--text); }
.nav-sub-item.active { background: var(--active-bg); color: var(--text); font-weight: 500; }
.nav-sub-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; }
.nav-sub-item.active .nav-sub-dot { background: var(--text); }

.sidebar-footer { padding: 12px 18px; border-top: 1px solid var(--sidebar-border); font-size: 10.5px; color: var(--text-3); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; margin-left: 0; transition: margin-left var(--tr); }
.main.sidebar-open { margin-left: var(--sidebar-w); }

.topbar {
  height: var(--topbar-h); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 14px;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 20; flex-shrink: 0;
}
.hamburger { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background var(--tr); flex-shrink: 0; }
.hamburger:hover { background: var(--hover-bg); }
.ham-lines { display: flex; flex-direction: column; gap: 4px; }
.ham-line { width: 16px; height: 1.5px; background: var(--text); border-radius: 2px; }
.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); }
.bc-item { white-space: nowrap; }
.bc-item.cur { color: var(--text); font-weight: 500; }
.bc-sep { color: var(--border); font-size: 16px; }
.topbar-actions { margin-left: auto; display: flex; gap: 6px; }
.pill-btn { height: 28px; padding: 0 14px; border: 1px solid var(--border); border-radius: 20px; background: var(--bg); font-size: 12px; font-weight: 500; color: var(--text-2); cursor: pointer; font-family: inherit; transition: all var(--tr); }
.pill-btn:hover { background: var(--hover-bg); color: var(--text); }

.content { flex: 1; overflow-y: auto; background: var(--bg); }
.content::-webkit-scrollbar { width: 5px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 3px; }

/* ── 아티클 공통 스타일 ── */
.article-wrap { max-width: 760px; margin: 0 auto; padding: 52px 40px 120px; }
.article-header { position: relative; padding-bottom: 36px; margin-bottom: 36px; border-bottom: 1px solid var(--border); }
.article-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--pill-bg); border-radius: 20px; font-size: 11.5px; font-weight: 500; color: var(--text-2); margin-bottom: 16px; }
.chip-dot { width: 5px; height: 5px; border-radius: 50%; background: #22c55e; }
.article-title { font-size: 32px; font-weight: 800; line-height: 1.2; letter-spacing: -0.04em; color: var(--text); margin-bottom: 14px; }
.article-sub { font-size: 15px; color: var(--text-2); line-height: 1.7; max-width: 620px; }
.sec { margin-bottom: 56px; }
.sec-label { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
.sec-title { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: var(--text); line-height: 1.3; margin-bottom: 16px; }
.sec-body { font-size: 14.5px; color: var(--text-2); line-height: 1.8; margin-bottom: 20px; }
.sh { font-size: 16px; font-weight: 700; letter-spacing: -0.025em; color: var(--text); margin-top: 32px; margin-bottom: 12px; }
.card { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-bottom: 10px; transition: box-shadow var(--tr); }
.card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
.card-title { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.card-num { width: 22px; height: 22px; border-radius: 6px; background: var(--text); color: white; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-body { font-size: 13.5px; color: var(--text-2); line-height: 1.7; }
.card-tag { display: inline-block; margin-top: 8px; padding: 2px 8px; background: var(--pill-bg); border-radius: 20px; font-size: 11px; font-weight: 500; color: var(--text-3); }
.hl { background: var(--pill-bg); border-radius: 10px; padding: 14px 18px; margin: 20px 0; font-size: 13.5px; color: var(--text-2); line-height: 1.7; border-left: 3px solid var(--text); }
.hl strong { color: var(--text); }
.summary-card { background: var(--text); color: white; border-radius: 16px; padding: 22px 24px; margin-bottom: 32px; font-size: 13.5px; line-height: 1.7; }
.summary-card strong { font-weight: 600; }
.tbl-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin: 18px 0; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { padding: 10px 16px; background: var(--sidebar-bg); font-size: 11px; font-weight: 600; text-align: left; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3); border-bottom: 1px solid var(--border); }
.tbl td { padding: 12px 16px; font-size: 13.5px; color: var(--text); border-bottom: 1px solid var(--sidebar-bg); line-height: 1.5; vertical-align: top; }
.tbl tr:last-child td { border-bottom: none; }
.tbl td.lbl { font-weight: 600; color: var(--text); white-space: nowrap; }
.tbl td.val { color: var(--text-2); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-blue { background: #eff6ff; color: #1d4ed8; }
.badge-red { background: #fef2f2; color: #dc2626; }
.badge-green { background: #f0fdf4; color: #16a34a; }
.badge-gray { background: var(--pill-bg); color: var(--text-3); }
.stats { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin: 18px 0; }
.stat-box { background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px 16px; }
.stat-val { font-size: 36px; font-weight: 800; letter-spacing: -0.05em; color: var(--text); line-height: 1; }
.stat-unit { font-size: 16px; font-weight: 400; color: var(--text-3); }
.stat-lbl { font-size: 12px; color: var(--text-3); margin-top: 6px; line-height: 1.4; }
.flow-wrap { border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; margin: 18px 0; overflow-x: auto; background: var(--sidebar-bg); }
.flow { display: flex; align-items: center; gap: 0; min-width: max-content; }
.flow-box { padding: 8px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; }
.flow-arrow { padding: 0 8px; font-size: 14px; color: var(--text-3); }
.blist { list-style: none; display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
.blist li { display: flex; gap: 10px; font-size: 14px; color: var(--text-2); line-height: 1.7; align-items: flex-start; }
.blist li::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; margin-top: 9px; }

/* 로딩 / 빈 상태 */
.loading { display: flex; align-items: center; justify-content: center; min-height: 60vh; font-size: 13px; color: var(--text-3); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; text-align: center; }
.empty-t { font-size: 15px; font-weight: 600; color: var(--text); }
.empty-d { font-size: 13px; color: var(--text-3); line-height: 1.6; max-width: 280px; }
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar collapsed" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg>
      </div>
      <span class="logo-text">나현 지식공간</span>
    </div>

    <div class="sidebar-scroll">

      <!-- 거시경제 -->
      <div class="nav-sec open" id="sec-macro">
        <button class="nav-sec-btn" onclick="toggleSec('macro')">
          <svg class="nav-sec-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M1 11l4-4 3 3 4-5 3 2V14H1z"/></svg>
          <span class="nav-sec-title">거시경제</span>
          <svg class="nav-sec-chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6 3l5 5-5 5V3z"/></svg>
        </button>
        <div class="nav-children">
          <button class="nav-item active" id="ni-macro1" onclick="showPage('macro1')">
            <span class="nav-item-dot"></span>
            <span>202606 거시경제현황</span>
            <span class="nav-item-date">06.03</span>
          </button>
        </div>
      </div>

      <!-- 데일리 경제뉴스 -->
      <div class="nav-sec" id="sec-daily">
        <button class="nav-sec-btn" onclick="toggleSec('daily')">
          <svg class="nav-sec-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M14 3H2a1 1 0 00-1 1v8a1 1 0 001 1h12a1 1 0 001-1V4a1 1 0 00-1-1zM2 5h12v1H2V5zm0 2h8v1H2V7zm0 2h5v1H2V9z"/></svg>
          <span class="nav-sec-title">데일리 경제뉴스</span>
          <svg class="nav-sec-chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6 3l5 5-5 5V3z"/></svg>
        </button>
        <div class="nav-children">
          <button class="nav-item" onclick="showPage('empty')">
            <span class="nav-item-dot"></span>
            <span style="font-size:12px; color:var(--text-3)">추가 예정</span>
          </button>
        </div>
      </div>

      <!-- 경제잡지 -->
      <div class="nav-sec" id="sec-mag">
        <button class="nav-sec-btn" onclick="toggleSec('mag')">
          <svg class="nav-sec-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M13 1H3a1 1 0 00-1 1v12a1 1 0 001 1h10a1 1 0 001-1V2a1 1 0 00-1-1zM7 4h5v1H7V4zm-3 0h2v1H4V4zm3 3h5v1H7V7zm-3 0h2v1H4V7zm3 3h5v1H7v-1zm-3 0h2v1H4v-1z"/></svg>
          <span class="nav-sec-title">경제잡지</span>
          <svg class="nav-sec-chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6 3l5 5-5 5V3z"/></svg>
        </button>
        <div class="nav-children">

          <!-- 260611 반도체/전력 하위 그룹 -->
          <div class="nav-group open" id="grp-semi">
            <button class="nav-group-btn" onclick="toggleGroup('semi')">
              <span class="nav-item-dot"></span>
              <span>260611 반도체/전력</span>
              <span class="nav-item-date" style="margin-left:auto; margin-right:4px;">06.11</span>
              <svg class="nav-group-chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6 3l5 5-5 5V3z"/></svg>
            </button>
            <div class="nav-sub-children">

              <!-- 한경비즈니스 -->
              <div style="padding:6px 10px 3px; font-size:10px; font-weight:700; letter-spacing:0.06em; color:var(--text-3); text-transform:uppercase;">한경비즈니스 1591호</div>
              <button class="nav-sub-item" id="ni-semi-sobu" onclick="showPage('semi-sobu')">
                <span class="nav-sub-dot"></span><span>500조 호황 — 소부장 현실</span>
                <span class="nav-item-date">06.03</span>
              </button>
              <button class="nav-sub-item" id="ni-semi-siltron" onclick="showPage('semi-siltron')">
                <span class="nav-sub-dot"></span><span>SK실트론 5조 몸값</span>
                <span class="nav-item-date">06.03</span>
              </button>
              <button class="nav-sub-item" id="ni-semi-oxidation" onclick="showPage('semi-oxidation')">
                <span class="nav-sub-dot"></span><span>산화공정 — 웨이퍼 보호막</span>

              <button class="nav-sub-item" id="ni-semi-hbm" onclick="showPage('semi-hbm')">

              <button class="nav-sub-item" id="ni-semi-etch" onclick="showPage('semi-etch')">

              <button class="nav-sub-item" id="ni-semi-deposition" onclick="showPage('semi-deposition')">

              <button class="nav-sub-item" id="ni-semi-metal" onclick="showPage('semi-metal')">

                <span class="nav-item-date">06.03</span>

              <button class="nav-sub-item" id="ni-semi-test" onclick="showPage('semi-test')">

              <button class="nav-sub-item" id="ni-semi-packaging" onclick="showPage('semi-packaging')">

              <!-- 매경이코노미 -->
              <div style="padding:10px 10px 3px; font-size:10px; font-weight:700; letter-spacing:0.06em; color:var(--text-3); text-transform:uppercase;">매경이코노미 2361호</div>

      <!-- 경제도서 -->
      <div class="nav-sec" id="sec-book">
        <button class="nav-sec-btn" onclick="toggleSec('book')">
          <svg class="nav-sec-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M3 1a1 1 0 00-1 1v12a1 1 0 001 1h8a1 1 0 001-1V4.5L9.5 1H3zm6 0v3h3L9 1zM4 6h6v1H4V6zm0 2h6v1H4V8zm0 2h4v1H4v-1z"/></svg>
          <span class="nav-sec-title">경제도서</span>
          <svg class="nav-sec-chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6 3l5 5-5 5V3z"/></svg>

        <div class="nav-children">

          <!-- 1. 세상 친절한 환율수업 -->
          <div class="nav-group open" id="grp-fx">
            <button class="nav-group-btn" onclick="toggleGroup('fx')">
              <span class="nav-item-dot"></span>
              <span>1. 세상 친절한 환율수업</span>
              <svg class="nav-group-chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6 3l5 5-5 5V3z"/></svg>

            <div class="nav-sub-children">

async function showPage(name) {
  // nav 활성화 초기화
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.nav-sub-item').forEach(n => n.classList.remove('active'));

  const cfg = pages[name];
  if (!cfg) return;

  // nav 활성화
  if (cfg.navId) {
    const el = document.getElementById(cfg.navId);
    if (el) el.classList.add('active');
  }

  // 브레드크럼 업데이트
  const bc = document.getElementById('bc');
  bc.innerHTML = cfg.bc[1]
    ? `<span class="bc-item">${cfg.bc[0]}</span><span class="bc-sep">/</span><span class="bc-item cur">${cfg.bc[1]}</span>`
    : `<span class="bc-item cur">${cfg.bc[0]}</span>`;

  const content = document.getElementById('content');
  content.scrollTo({ top: 0, behavior: 'smooth' });

  // 빈 페이지
  if (!cfg.file) {
    content.innerHTML = `<div class="article-wrap"><div class="empty"><div class="empty-t">아직 내용이 없습니다</div><div class="empty-d">이 섹션의 아이템을 함께 추가해 나가요.</div></div></div>`;
    return;
  }

  // 아티클 파일 불러오기
  content.innerHTML = '<div class="loading">불러오는 중…</div>';
  try {
    const res = await fetch(cfg.file);
    if (!res.ok) throw new Error('not found');
    const html = await res.text();
    content.innerHTML = html;
  } catch (e) {
    content.innerHTML = `<div class="article-wrap"><div class="empty"><div class="empty-t">불러오기 실패</div><div class="empty-d">파일을 찾을 수 없습니다.</div></div></div>`;
  }
}

// 첫 화면 로드
